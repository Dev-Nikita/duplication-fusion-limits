services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts:ro
  core:
    build:
      context: .
      args:
        BASE: ${BASE_IMAGE:-ubuntu:22.04}
    image: paef-testbed:0.1
    depends_on: [mongo]
    cap_add: [NET_ADMIN, SYS_NICE, SYS_PTRACE]
    devices: ["/dev/net/tun:/dev/net/tun"]
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./out:/out
      - ./scripts:/scripts:ro
    environment:
      DB_URI: mongodb://mongo/open5gs
